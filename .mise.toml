# .mise.toml — local tooling, exact pins (repo convention)
#
# The tasks below define how urlshortener-ui is built and checked. CI uses
# these tasks. Renovate keeps every pin in this file current.

[settings]
# The pins below are the only source of tool versions. Without this, mise
# reads the go directive of go.mod (the minimum language version) and runs
# that Go instead of the pin.
idiomatic_version_file_enable_tools = []

[tools]
# Keep in lockstep with the golang build image in the Dockerfile; Renovate
# bumps both together. The go directive in go.mod (minimum language version)
# is bumped by hand.
go = "1.27.1"

# Pre-commit for Git hooks
pre-commit = "4.6.2"

# Linters. golangci-lint must match the version in .custom-gcl.yml; Renovate
# groups the two into one PR.
golangci-lint = "2.14.0"
yamllint = "1.38.0"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it's on PATH, and
# silently skips them when it isn't.
shellcheck = "0.11.0"

# Signs the container images the release workflow publishes (keyless, through
# the workflow's OIDC identity).
cosign = "3.1.3"

# Pins GitHub Actions to commit SHAs (see the update-gha task)
pinact = "5.0.0"

# Runs the commit message check in .github/commit-lint (pr-hygiene.yaml).
bun = "1.4.2"

[tasks.build]
description = "Build the urlshortener-ui binary into bin/"
run = "go build -o bin/urlshortener-ui ."

[tasks.test]
description = "Run the test suite with race detector and coverage"
run = "go test -race -covermode=atomic -coverprofile=coverage.txt ./..."

# `mise run fmt` rewrites everything that has a canonical form; `mise run
# lint` checks the same things without touching a file.
[tasks.fmt]
description = "Format everything: go.mod and Go sources"
run = [
  { task = "go-tidy" },
  { task = "go-fmt" },
]

[tasks.go-tidy]
description = "Tidy go.mod and go.sum"
run = "go mod tidy"

# The same gofmt and goimports settings `mise run lint` checks, read from
# .golangci.yaml.
[tasks.go-fmt]
description = "Format Go sources with the formatters configured for golangci-lint"
run = "golangci-lint fmt"

# golint-sl runs as a golangci-lint module plugin, so it has to be compiled into
# a custom binary (./custom-gcl). Rebuilds only when .custom-gcl.yml changes.
[tasks.lint-build]
description = "Build the custom-gcl binary with the golint-sl plugin baked in"
# The build downloads golangci-lint's whole dependency tree, and the module
# proxy sometimes resets the HTTP/2 stream partway through. Modules already
# downloaded stay in the cache, so a retry picks up where it failed.
run = """
for attempt in 1 2 3; do
  golangci-lint custom && exit 0
  echo "golangci-lint custom failed (attempt $attempt of 3)" >&2
  sleep 10
done
exit 1
"""
sources = [".custom-gcl.yml"]
outputs = ["custom-gcl"]

[tasks.go-lint]
description = "Lint the Go module with golangci-lint and golint-sl"
depends = ["lint-build"]
run = "./custom-gcl run ./..."

[tasks.lint]
description = "Lint the Go module with golangci-lint and golint-sl, YAML and workflows"
depends = ["go-lint", "yaml-lint", "actionlint"]

# The image builds the module as it is, so an untidy go.mod has to fail CI
# rather than be fixed up at release time.
[tasks.mod-tidy]
description = "Check that go.mod and go.sum are tidy"
run = "go mod tidy -diff"

[tasks.yaml-lint]
description = "Lint every YAML file in the repository"
run = "yamllint --strict ."

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

# The image CI builds and the release publishes, for the local platform. Needs
# a Docker daemon, which mise doesn't provide.
[tasks.image]
description = "Build the container image for the local platform, tagged with the given name (default urlshortener-ui:dev)"
usage = 'arg "[image]" default="urlshortener-ui:dev"'
run = "docker build --tag ${usage_image} ."

[tasks.serve]
description = "Serve the UI on localhost:8080 against the API at SHORTLINK_URL (default http://localhost:8123)"
env = { SHORTLINK_URL = "{{ env.SHORTLINK_URL | default(value='http://localhost:8123') }}" }
run = "go run . serve --debug --bind-address localhost:8080"

[tasks.check]
description = "The definition of done: every gate CI runs on the Go code"
depends = [
  "lint",
  "mod-tidy",
  "test",
]

[tasks.update-gha]
description = "Pin GitHub Actions to commit SHAs (Renovate keeps them current afterwards)"
run = "pinact run"
