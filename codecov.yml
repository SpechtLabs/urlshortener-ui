# Codecov fails a pull request when the lines it changes are less than 85%
# covered, or when it lowers the project's coverage. The project target follows
# the base branch (auto) rather than a fixed 85%, because the UI had no tests
# before; raise it to 85% once the project gets there.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 85%

# The API client is swagger-codegen's output, not written by hand.
ignore:
  - "pkg/swagger/**"
