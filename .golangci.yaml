# golangci-lint configuration for urlshortener-ui.
#
# golint-sl runs as a module plugin baked into ./custom-gcl (see .custom-gcl.yml).
# The prebuilt golangci-lint cannot load the plugin, so run it with
# `mise run lint`, which builds custom-gcl and runs it.
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - dogsled
    - copyloopvar
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - whitespace
    - unconvert
    - unparam

    # golint-sl: production-ready Go patterns (error handling, observability, safety)
    # https://golint.specht-labs.de/
    - golint-sl

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    custom:
      golint-sl:
        type: module
        description: SpechtLabs Go linter collection for production-ready code
        original-url: github.com/spechtlabs/golint-sl

  exclusions:
    generated: lax
    rules:
      # Hold test files to a lighter bar than production code.
      - linters:
          - gosec
          - goconst
          - golint-sl
        path: _test\.go

      # Test tables are laid out for reading, not for size.
      - linters:
          - govet
        text: "^fieldalignment:"
        path: _test\.go

      # contextlogger matches otelzap.L() as zap.L(). otelzap's *Context
      # methods, which every log call here uses, take the trace and span from
      # the context they're given.
      - linters:
          - golint-sl
        text: "^contextlogger: function has context parameter but uses global logger"

      # serve is the composition root: it's where the API client and the UI
      # client are created, to be injected into everything else.
      - linters:
          - golint-sl
        text: "^interfaceconsistency: creating New(APIClient|UIClient) inside function"
        path: ^cmd/serve\.go$

      # serve and Server.Run run for the life of the process, outside any
      # request, so there is no span in their context to annotate. Run shuts
      # the server down gracefully when its context is canceled, which is the
      # stop lifecycle asks for.
      - linters:
          - golint-sl
        text: '^lifecycle: type "Server" has Run\(\) method'
        path: ^pkg/router/router\.go$

      - linters:
          - golint-sl
        text: "^wideevents: function has context.Context but doesn't use span attributes"
        path: ^(cmd/serve|pkg/router/router)\.go$

      # Load registers the handlers of the client NewServer was given; a nil
      # client is a bug in the caller, and checking for it here would only
      # turn the panic at startup into a server without pages.
      - linters:
          - golint-sl
        text: '^nilcheck: pointer parameter "uiClient"'
        path: ^pkg/router/router\.go$

    paths:
      - third_party$
      - builtin$
      - examples$
      # The urlshortener API client is swagger-codegen's output. Its files
      # don't carry the "Code generated" header that `generated: lax` looks
      # for.
      - ^pkg/swagger/

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^pkg/swagger/
